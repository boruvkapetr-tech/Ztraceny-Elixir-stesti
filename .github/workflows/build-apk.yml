
name: Sestavit Elixir Stesti APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Stahnout projekt
        uses: actions/checkout@v4

      - name: Nastavit Javu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Nastavit Android SDK
        uses: android-actions/setup-android@v3

      - name: Nastavit Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Najit projekt a sestavit APK
        shell: bash
        run: |
          PROJECT=$(find . -name settings.gradle -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "Soubor settings.gradle nebyl nalezen"
            exit 1
          fi
          cd "$(dirname "$PROJECT")"
          gradle assembleDebug --no-daemon

      - name: Ulozit APK
        uses: actions/upload-artifact@v4
        with:
          name: ElixirStesti-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
